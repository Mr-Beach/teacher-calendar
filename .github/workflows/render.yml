name: Render calendar

# Re-renders docs/index.html and commits it automatically whenever the course
# data or the renderer itself changes on main. This is the one manual step
# left in the publish loop (edit -> render -> commit -> push); this Action
# removes "render" from that list, so pushing a JSON edit is enough.
on:
  push:
    branches: [main]
    paths:
      - "courses/**.json"
      - "render.py"
      - "engine.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render
        run: python3 render.py courses/math6.json > docs/index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Auto-render calendar [skip ci]"
          git push
